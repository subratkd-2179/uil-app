# Configuration file for UIL Tutor AI
# Update these values as needed

[API_SERVER]
# API Server settings
HOST = 0.0.0.0
PORT = 5000
DEBUG = True
THREADED = True

[FILE_UPLOAD]
# File upload settings
UPLOAD_FOLDER = uploads
MAX_FILE_SIZE_MB = 16
ALLOWED_EXTENSIONS = pdf,jpg,jpeg,png

[DATABASE]
# Database settings
DATABASE_FILE = uil_tutor.db
DATABASE_TYPE = sqlite3

[FRONTEND]
# Frontend settings
API_BASE_URL = http://localhost:5000/api
NOTIFICATION_DURATION_MS = 3000
AUTO_CLOSE_ON_EXIT = True

[AI_TRAINING]
# AI Training settings
MIN_TRAINING_PAPERS = 100
CONFIDENCE_THRESHOLD = 0.8
EVALUATION_TIMEOUT_SECONDS = 30

[SECURITY]
# Security settings
REQUIRE_AUTH = False
ENABLE_CORS = True
SESSION_TIMEOUT_MINUTES = 60
ALLOWED_ORIGINS = http://localhost:3000,http://localhost:5000

[LOGGING]
# Logging settings
LOG_LEVEL = INFO
LOG_FILE = logs/uil_tutor.log
LOG_MAX_SIZE_MB = 10
LOG_BACKUP_COUNT = 5

[EVENTS]
# Supported UIL Events
CURRENT_EVENTS = Number Sense,Mathematics
FUTURE_EVENTS = Debate,Speech,Science Olympiad,Spelling,Vocabulary

# Developer Notes:
# - Modify ALLOWED_EXTENSIONS to support more file types
# - Increase MAX_FILE_SIZE_MB for larger uploads
# - Set REQUIRE_AUTH = True for production use
# - Use DATABASE_TYPE = postgresql for production deployments
# - Keep DEBUG = False in production
